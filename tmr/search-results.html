<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Results | Technology &amp; Management Review</title>

<link rel="icon" type="image/png" href="/tmr/tmr-favicon.png">

<link rel="stylesheet" href="/tmr/assets/css/header.css">
<link rel="stylesheet" href="/tmr/assets/css/header-search.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f6f8fb;
color:#333;
line-height:1.7;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

.search-section{
padding:60px 0;
min-height:500px;
}

.search-box{
margin-bottom:40px;
}

.search-box form{
display:flex;
gap:10px;
}

.search-box input{
flex:1;
padding:16px;
font-size:17px;
border:1px solid #ccc;
border-radius:6px;
outline:none;
}

.search-box input:focus{
border-color:#083b66;
}

.search-box button{
padding:16px 30px;
border:none;
border-radius:6px;
background:#083b66;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.search-box button:hover{
background:#0d5b97;
}

#result-count{
margin-bottom:30px;
font-size:18px;
font-weight:bold;
color:#444;
}

.result{
background:#fff;
padding:25px;
margin-bottom:25px;
border-radius:8px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.result h2{
font-size:24px;
margin-bottom:10px;
}

.result h2 a{
color:#083b66;
text-decoration:none;
}

.result h2 a:hover{
text-decoration:underline;
}

.meta{
font-size:15px;
color:#666;
margin-bottom:12px;
}

.authors{
font-size:16px;
font-weight:bold;
margin-bottom:12px;
}

.abstract{
color:#444;
margin-bottom:20px;
}

.read-btn{
display:inline-block;
padding:10px 20px;
background:#083b66;
color:#fff;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

.read-btn:hover{
background:#0d5b97;
}

.no-results{
display:none;
background:#fff;
padding:40px;
border-radius:8px;
text-align:center;
font-size:20px;
color:#666;
}

footer{
background:#083b66;
color:#fff;
padding:35px 0;
text-align:center;
margin-top:60px;
}

@media(max-width:900px){

.search-box form{
flex-direction:column;
}

.search-box button{
width:100%;
}

}

</style>

</head>

<body>

<div id="site-header"></div>

<section class="search-section">

<div class="container">

<div class="search-box">

<form
action="/tmr/search-results.html"
method="GET">

<input
type="search"
id="searchInput"
name="q"
placeholder="Search articles, authors, keywords..."
required>

<button type="submit">
Search
</button>

</form>

</div>

<div id="result-count"></div>

<div id="results"></div>

<div
id="no-results"
class="no-results">

No matching results were found.

</div>

</div>

</section>

<footer>

<p>
&copy; 2026 Technology &amp; Management Review. All Rights Reserved.
</p>

</footer>

<script src="/tmr/assets/js/header-loader.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async function () {

    const searchInput =
        document.getElementById("searchInput");

    const resultsContainer =
        document.getElementById("results");

    const resultCount =
        document.getElementById("result-count");

    const noResults =
        document.getElementById("no-results");

    const params =
        new URLSearchParams(window.location.search);

    const query =
        (params.get("q") || "").trim();

    searchInput.value = query;

    if (!query) {

        resultCount.textContent =
            "Enter a keyword to search the journal.";

        return;

    }

    try {

        const response = await fetch(
            "/tmr/assets/search-index.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "Search index could not be loaded."
            );
        }

        const searchData =
            await response.json();

        const searchWords =
            query
            .toLowerCase()
            .split(/\s+/)
            .filter(Boolean);

        const results =
            searchData.filter(function (item) {

                const searchableText = [

                    item.title,
                    item.authors,
                    item.keywords,
                    item.abstract,
                    item.volume,
                    item.issue,
                    item.year,
                    item.pages,
                    item.doi,
                    item.type

                ]
                .join(" ")
                .toLowerCase();

                return searchWords.every(
                    function (word) {

                        return searchableText
                            .includes(word);

                    }
                );

            });

        renderResults(
            results,
            query
        );

    }

    catch (error) {

        console.error(error);

        resultCount.textContent =
            "Search index is temporarily unavailable.";

    }


    function renderResults(
        results,
        keyword
    ) {

        resultsContainer.innerHTML = "";

        if (results.length === 0) {

            resultCount.textContent =
                '0 results found for "' +
                keyword +
                '".';

            noResults.style.display =
                "block";

            return;

        }

        noResults.style.display =
            "none";

        resultCount.textContent =
            results.length +
            ' result(s) found for "' +
            keyword +
            '".';

        results.forEach(function (item) {

            const card =
                document.createElement("article");

            card.className =
                "result";

            const title =
                document.createElement("h2");

            const link =
                document.createElement("a");

            link.href =
                item.url;

            link.textContent =
                item.title;

            title.appendChild(link);

            card.appendChild(title);


            const meta =
                document.createElement("div");

            meta.className =
                "meta";

            const metaParts = [];

            if (item.type) {
                metaParts.push(item.type);
            }

            if (item.volume) {
                metaParts.push(
                    "Volume " +
                    item.volume
                );
            }

            if (item.issue) {
                metaParts.push(
                    "Issue " +
                    item.issue
                );
            }

            if (item.year) {
                metaParts.push(
                    item.year
                );
            }

            if (item.pages) {
                metaParts.push(
                    "Pages " +
                    item.pages
                );
            }

            meta.textContent =
                metaParts.join(" • ");

            card.appendChild(meta);


            if (item.authors) {

                const authors =
                    document.createElement("div");

                authors.className =
                    "authors";

                authors.textContent =
                    item.authors.replaceAll(
                        ";",
                        ","
                    );

                card.appendChild(authors);

            }


            if (item.abstract) {

                const abstract =
                    document.createElement("div");

                abstract.className =
                    "abstract";

                abstract.textContent =
                    item.abstract;

                card.appendChild(abstract);

            }


            const openButton =
                document.createElement("a");

            openButton.className =
                "read-btn";

            openButton.href =
                item.url;

            openButton.textContent =
                item.type === "article"
                ? "View Article"
                : "Open Page";

            card.appendChild(
                openButton
            );

            resultsContainer.appendChild(
                card
            );

        });

    }

});

</script>

</body>

</html>
