name: Build Global Search Index

on:
  push:
    paths:
      - "tmr/assets/search-index.json"
      - "dsr/assets/search-index.json"
      - "ijrstp/assets/search-index.json"
      - "ajase/assets/search-index.json"
      - ".github/scripts/build_global_search_index.py"
      - ".github/workflows/global-search-index.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-global-search-index:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build global search index
        run: |
          python .github/scripts/build_global_search_index.py

      - name: Commit updated global search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/search-index.json

          if git diff --cached --quiet; then
            echo "Global search index is already up to date."
          else
            git commit -m "Auto-update global search index"
            git push
          fi